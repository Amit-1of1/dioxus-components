[package]
# PATCH(rust-ui): DioxusLabs/components primitives at 9a75825 plus the fixes in Rust UI's
# docs/FORKS.md, published under its own name because upstream has not released
# `dioxus-primitives` (crates.io holds an empty 0.0.0 placeholder). The library keeps its name,
# so code still says `use dioxus_primitives::...`.
name = "rust-ui-primitives"
version = "0.1.0"
description = "Accessible, unstyled Dioxus primitives: DioxusLabs/components primitives with the Rust UI fixes"
edition = "2021"
rust-version = "1.80.0"
readme = "../README.md"
keywords = ["gui", "dioxus", "components", "primitives"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs", "DogeDark"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/Amit-1of1/dioxus-components"

[lib]
name = "dioxus_primitives"

[dependencies]
dioxus.workspace = true
dioxus-attributes = { path = "../dioxus-attributes", package = "rust-ui-attributes", version = "0.1.0" }
dioxus-sdk-time = "0.7.0"
time = { version = "0.3.44", features = ["std", "macros", "parsing", "local-offset"] }
num-integer = "0.1.46"
tracing.workspace = true
serde = { version = "1.0", features = ["derive"] }
palette = "0.7.6"

[build-dependencies]
lazy-js-bundle = "0.7.9"

[dev-dependencies]
dioxus-ssr = "0.7.0"

[features]
default = ["router"]
router = ["dioxus/router"]
web = ["time/wasm-bindgen"]
