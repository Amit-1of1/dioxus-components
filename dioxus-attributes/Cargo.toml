[package]
# PATCH(rust-ui): published as atoll-attributes for atoll-primitives; the library keeps its name.
name = "atoll-attributes"
version = "0.1.0"
edition = "2021"
description = "Proc macro for creating dynamic attribute lists for Dioxus elements"
license = "MIT OR Apache-2.0"
authors = ["Dioxus Labs"]
repository = "https://github.com/Amit-1of1/dioxus-components"

[lib]
name = "dioxus_attributes"
proc-macro = true

[dependencies]
dioxus-rsx = {  workspace = true }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
