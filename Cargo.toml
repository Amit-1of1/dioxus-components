[workspace]
resolver = "3"
members = ["primitives", "preview", "test-harness", "dioxus-attributes"]

[workspace.dependencies]
# PATCH(rust-ui): published as atoll-primitives; the dependency key and the library name
# stay `dioxus-primitives` / `dioxus_primitives`, so no source changes.
dioxus-primitives = { path = "primitives", package = "atoll-primitives", version = "0.1.0" }
tracing = { version = "0.1", features = ["std"] }

dioxus = "0.7.8"
dioxus-rsx = "0.7.8"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1
